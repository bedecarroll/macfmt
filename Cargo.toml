[package]
name = "macfmt"
version = "0.0.2"
edition = "2024"
rust-version = "1.96"
description = "A tool to format MAC addresses in various formats"
authors = ["Bede Carroll"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
regex = "1.12"
log = "0.4"
env_logger = "0.11"
edit = "0.1"
which = "8.0"
